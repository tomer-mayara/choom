  # The route methods of a Hono app, such as app.post('/orders', (c) => c.text('Created'))
  # after const app = new Hono() with import { Hono } from 'hono'. The path is the name
  # and the last argument is the handler. Hono has no head method: a get route also
  # answers HEAD requests.
  - id: hono-route-get
    version: 1
    library: hono
    entryKind: http-route
    kind: call
    importName: hono
    callPath: new Hono().get
    nameArgument: 0
    handlerArgument: last
  - id: hono-route-post
    version: 1
    library: hono
    entryKind: http-route
    kind: call
    importName: hono
