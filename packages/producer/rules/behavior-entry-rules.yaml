    entryKind: http-route
    kind: call
    importName: express
    callPath: Router().all
    nameArgument: 0
    handlerArgument: last
  # The route methods of a Fastify server, such as fastify.post('/orders', opts, createOrder)
  # after const fastify = Fastify() with import Fastify from 'fastify', or after
  # const fastify = require('fastify')(). The path is the name. Route options can come
  # before the handler, so the last argument is the handler.
  - id: fastify-route-get
    version: 1
    library: fastify
    entryKind: http-route
    kind: call
    importName: fastify
    callPath: fastify().get
    nameArgument: 0
    handlerArgument: last
  - id: fastify-route-post
    version: 1
    library: fastify
    entryKind: http-route
    kind: call
    importName: fastify
    callPath: fastify().post
