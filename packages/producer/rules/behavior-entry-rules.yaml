    importName: hono
    callPath: new Hono().all
    nameArgument: 0
    handlerArgument: last
  # The worker threads that the Worker class of the Node.js module node:worker_threads
  # starts, such as new Worker('./worker.js', { workerData }) after
  # import { Worker } from 'node:worker_threads'. The worker file, the first argument,
  # is the name. The call has no handler function: the worker runs its file. A worker
  # file such as __filename or new URL('./worker.js', import.meta.url) is not a string
  # literal, so the name is null.
  - id: node-worker-threads-worker
    version: 1
    library: node:worker_threads
    entryKind: worker-thread
    kind: call
    importName: node:worker_threads
    callPath: new Worker
    nameArgument: 0
    handlerArgument: null
  # The same worker threads when the code names the module worker_threads, without
  # node:, such as const { Worker } = require('worker_threads'). A rule finds the calls
  # of one module name, so each name has a rule.
  - id: worker-threads-worker
    version: 1
    library: node:worker_threads
    entryKind: worker-thread
    kind: call
    importName: worker_threads
    callPath: new Worker
    nameArgument: 0
    handlerArgument: null
  # The queue workers that the Worker class of BullMQ starts, such as
  # new Worker('foo', async job => { ... }, { connection }) after
  # import { Worker } from 'bullmq'. The queue name, the first argument, is the name.
  # The processor, the second argument, is the handler. Options can follow the
  # processor, so the handler is not the last argument. A sandboxed processor is the
  # path of a file, not a function: a path as a string literal gives no handler, and
  # the name of a variable gives the declaration of that variable.
  - id: bullmq-worker
    version: 1
    library: bullmq
    entryKind: queue-worker
    kind: call
    importName: bullmq
    callPath: new Worker
    nameArgument: 0
    handlerArgument: 1
  # The entries of a Vite build that the Rollup options of the build name, such as
  # build: { rollupOptions: { input: { main: 'index.html', nested: 'nested/index.html' } } }
  # in vite.config.js. The input is a path, an array of paths or an object whose property
  # values are paths. Vite 8 renames these options rolldownOptions and keeps
  # rollupOptions as an alias.
  - id: vite-build-rollup-options-input
    version: 1
    library: vite
    entryKind: frontend-entry
    kind: settings-literal
    fileGlob: '**/vite.config.{js,mjs,cjs,ts,mts,cts}'
    propertyPath: build.rollupOptions.input
  # The same entries with the Vite 8 name of these options, such as
  # build: { rolldownOptions: { input: ['index.html', 'nested/index.html'] } }.
  - id: vite-build-rolldown-options-input
    version: 1
    library: vite
    entryKind: frontend-entry
    kind: settings-literal
    fileGlob: '**/vite.config.{js,mjs,cjs,ts,mts,cts}'
    propertyPath: build.rolldownOptions.input
  # The entries that the top-level input of Vite 8 names, such as
  # input: { main: 'index.html', nested: 'nested/index.html' }. Vite also uses this
  # input in development. An input of the build options replaces it for the build.
  - id: vite-input
    version: 1
    library: vite
    entryKind: frontend-entry
    kind: settings-literal
    fileGlob: '**/vite.config.{js,mjs,cjs,ts,mts,cts}'
    propertyPath: input
  # The entries of a library that Vite builds in library mode, such as
  # build: { lib: { entry: 'lib/main.js', name: 'MyLib' } }. The entry is a path, an
  # array of paths or an object whose property values are paths.
  - id: vite-build-lib-entry
    version: 1
    library: vite
    entryKind: frontend-entry
    kind: settings-literal
    fileGlob: '**/vite.config.{js,mjs,cjs,ts,mts,cts}'
    propertyPath: build.lib.entry
  # The commands of a commander program on the program export, such as
  # program.command('clone <source> [destination]').description('...').action(clone)
  # after import { program } from 'commander'. The rule finds the action call. The name is
  # the first argument of the command call, the call before action (nameCall: 1), with the
  # arguments of the command as the call writes them. The action, the first argument of
  # the action call, is the handler. The builder calls of the command can come between
  # the command call and the action call, and the builder calls of the program before the
  # command call: sameValueMethods lists each method of Command that has a form that
  # returns the command itself, as the typings of commander 15 declare them, except
  # action, command and parse. A command call makes a new command, so it is not a builder
  # call.
  - id: commander-program-command
    version: 1
    library: commander
    entryKind: cli-command
    kind: call
    importName: commander
    callPath: program.command().action
    nameArgument: 0
    handlerArgument: 0
    nameCall: 1
    sameValueMethods: [addArgument, addCommand, addHelpCommand, addHelpOption, addHelpText, addOption, alias, aliases,
      allowExcessArguments, allowUnknownOption, argument, arguments, combineFlagAndOptionalValue, commandsGroup,
      configureHelp, configureOutput, copyInheritedSettings, description, enablePositionalOptions, executableDir,
      exitOverride, helpCommand, helpGroup, helpOption, hook, name, nameFromFilename, on, option, optionsGroup,
      passThroughOptions, requiredOption, setOptionValue, setOptionValueWithSource, showHelpAfterError,
      showSuggestionAfterError, storeOptionsAsProperties, summary, usage, version]
  # The same commands of a program that new Command() makes, such as
  # const program = new Command() after import { Command } from 'commander'.
  - id: commander-class-command
    version: 1
    library: commander
    entryKind: cli-command
    kind: call
    importName: commander
    callPath: new Command().command().action
    nameArgument: 0
    handlerArgument: 0
    nameCall: 1
    sameValueMethods: [addArgument, addCommand, addHelpCommand, addHelpOption, addHelpText, addOption, alias, aliases,
      allowExcessArguments, allowUnknownOption, argument, arguments, combineFlagAndOptionalValue, commandsGroup,
      configureHelp, configureOutput, copyInheritedSettings, description, enablePositionalOptions, executableDir,
      exitOverride, helpCommand, helpGroup, helpOption, hook, name, nameFromFilename, on, option, optionsGroup,
      passThroughOptions, requiredOption, setOptionValue, setOptionValueWithSource, showHelpAfterError,
      showSuggestionAfterError, storeOptionsAsProperties, summary, usage, version]
  # The commands of a yargs program, such as
  # yargs(hideBin(process.argv)).command('serve [port]', 'start the server', builder, handler)
  # after import yargs from 'yargs'. The name is the first argument, with the arguments of
  # the command, and the last argument is the handler. A command call gives the yargs
  # instance that it is called on, so one chain can have several command calls:
  # sameValueMethods lists each method of a yargs instance that returns the instance, as
  # yargs 18 writes them, command among them.
  - id: yargs-command
    version: 1
    library: yargs
    entryKind: cli-command
    kind: call
    importName: yargs
    callPath: yargs().command
    nameArgument: 0
    handlerArgument: last
    sameValueMethods: [addHelpOpt, addShowHiddenOpt, alias, array, boolean, check, choices, coerce, command, commandDir,
      commands, completion, config, conflicts, count, default, defaults, demand, demandCommand, demandOption,
      deprecateOption, describe, detectLocale, env, epilog, epilogue, example, exitProcess, fail, global, group, help,
      hide, implies, locale, middleware, nargs, normalize, number, option, options, parserConfiguration, pkgConf,
      positional, recommendCommands, require, required, requiresArg, scriptName, showCompletionScript, showHelp,
      showHelpOnFail, showHidden, showVersion, skipValidation, strict, strictCommands, strictOptions, string,
      updateLocale, updateStrings, usage, usageConfiguration, version, wrap]
