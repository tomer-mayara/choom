# The pinned list of Choom behavior entry rules. Stage 4 start saves a copy of this
# file and its SHA-256, and Stage 4 collect applies the rules to the source files of
# the graph scope. The contract is cookbook/interfaces/behavior-entry-rules.tsp.
# A rule that changes keeps its ID and gets the next version.
# Each http-route rule finds the calls of one route method, so the rule of a candidate
# names the method. Its ID says the library, the receiver and the method.
formatVersion: 1
rules:
  # The get routes of an Express app, such as app.get('/orders', listOrders) after
  # const app = express(). The path is the name and the last argument is the handler.
  # A get call with only one argument reads a setting of the app, so it is not a match.
  - id: express-route-get
    version: 1
    library: express
    entryKind: http-route
    kind: call
    importName: express
    callPath: express().get
    nameArgument: 0
    handlerArgument: last
  # The other route methods of an Express app, such as app.post('/orders', createOrder)
  # after const app = express(). The path is the name and the last argument is the
  # handler.
  - id: express-route-post
    version: 1
    library: express
    entryKind: http-route
    kind: call
    importName: express
    callPath: express().post
    nameArgument: 0
    handlerArgument: last
  - id: express-route-put
    version: 1
    library: express
    entryKind: http-route
    kind: call
    importName: express
    callPath: express().put
    nameArgument: 0
    handlerArgument: last
  - id: express-route-patch
    version: 1
    library: express
    entryKind: http-route
    kind: call
    importName: express
    callPath: express().patch
    nameArgument: 0
    handlerArgument: last
  - id: express-route-delete
    version: 1
    library: express
    entryKind: http-route
    kind: call
    importName: express
    callPath: express().delete
    nameArgument: 0
    handlerArgument: last
  - id: express-route-options
    version: 1
    library: express
    entryKind: http-route
    kind: call
    importName: express
    callPath: express().options
    nameArgument: 0
    handlerArgument: last
  - id: express-route-head
    version: 1
    library: express
    entryKind: http-route
    kind: call
    importName: express
    callPath: express().head
    nameArgument: 0
    handlerArgument: last
  - id: express-route-all
    version: 1
    library: express
    entryKind: http-route
    kind: call
    importName: express
    callPath: express().all
    nameArgument: 0
    handlerArgument: last
  # The route methods of an Express router, such as router.post('/orders', createOrder)
  # after const router = express.Router(), or after const router = Router() with
  # import { Router } from 'express'. The path is the name in the router, without the
  # path that app.use gives the router. The last argument is the handler.
  - id: express-router-get
    version: 1
    library: express
    entryKind: http-route
    kind: call
    importName: express
    callPath: Router().get
    nameArgument: 0
    handlerArgument: last
  - id: express-router-post
    version: 1
    library: express
    entryKind: http-route
    kind: call
    importName: express
    callPath: Router().post
    nameArgument: 0
    handlerArgument: last
  - id: express-router-put
    version: 1
    library: express
    entryKind: http-route
    kind: call
    importName: express
    callPath: Router().put
    nameArgument: 0
    handlerArgument: last
  - id: express-router-patch
    version: 1
    library: express
    entryKind: http-route
    kind: call
    importName: express
    callPath: Router().patch
    nameArgument: 0
    handlerArgument: last
  - id: express-router-delete
    version: 1
    library: express
    entryKind: http-route
    kind: call
    importName: express
    callPath: Router().delete
    nameArgument: 0
    handlerArgument: last
  - id: express-router-options
    version: 1
    library: express
    entryKind: http-route
    kind: call
    importName: express
    callPath: Router().options
    nameArgument: 0
    handlerArgument: last
  - id: express-router-head
    version: 1
