    importName: hono
    callPath: new Hono().all
    nameArgument: 0
    handlerArgument: last
  # The worker threads that the Worker class of the Node.js module node:worker_threads
  # starts, such as new Worker('./worker.js', { workerData }) after
  # import { Worker } from 'node:worker_threads'. The worker file, the first argument,
  # is the name. The call has no handler function: the worker runs its file. A worker
  # file such as __filename or new URL('./worker.js', import.meta.url) is not a string
  # literal, so the name is null.
  - id: node-worker-threads-worker
    version: 1
    library: node:worker_threads
    entryKind: worker-thread
    kind: call
    importName: node:worker_threads
    callPath: new Worker
    nameArgument: 0
    handlerArgument: null
  # The same worker threads when the code names the module worker_threads, without
  # node:, such as const { Worker } = require('worker_threads'). A rule finds the calls
  # of one module name, so each name has a rule.
  - id: worker-threads-worker
    version: 1
    library: node:worker_threads
    entryKind: worker-thread
    kind: call
    importName: worker_threads
    callPath: new Worker
    nameArgument: 0
    handlerArgument: null
  # The queue workers that the Worker class of BullMQ starts, such as
  # new Worker('foo', async job => { ... }, { connection }) after
  # import { Worker } from 'bullmq'. The queue name, the first argument, is the name.
  # The processor, the second argument, is the handler. Options can follow the
  # processor, so the handler is not the last argument. A sandboxed processor is the
  # path of a file, not a function: a path as a string literal gives no handler, and
  # the name of a variable gives the declaration of that variable.
  - id: bullmq-worker
    version: 1
    library: bullmq
    entryKind: queue-worker
    kind: call
    importName: bullmq
    callPath: new Worker
    nameArgument: 0
    handlerArgument: 1
