name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Set up Ubuntu package downloads
        run: |
          # Use an independent mirror while Canonical DNS is unavailable.
          printf '%s\n' 'https://mirrors.kernel.org/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          printf '%s\n' 'APT::Update::Error-Mode "any";' | sudo tee /etc/apt/apt.conf.d/99choom-ci > /dev/null
      - run: bunx --no-install playwright install --with-deps chromium
      - name: Validate all four constraints
        run: ./scripts/run_all_constraints.sh
      - name: Check code hygiene
        if: ${{ !cancelled() }}
        run: |
          bun run lint
          bun run check:unused
          bun run check:duplicates
      - name: Retain browser and constraint evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-evidence-${{ github.sha }}
          path: |
            test-results/
            reports/constraints/

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Set up Ubuntu package downloads
        if: runner.os == 'Linux'
        run: |
          # Use an independent mirror while Canonical DNS is unavailable.
          printf '%s\n' 'https://mirrors.kernel.org/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          printf '%s\n' 'APT::Update::Error-Mode "any";' | sudo tee /etc/apt/apt.conf.d/99choom-ci > /dev/null
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: rustup show
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run desktop:lint
      - run: bun run desktop:test
      - run: bun run tauri build --debug --no-bundle -- --locked
      - name: Install Linux packaged acceptance drivers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y webkit2gtk-driver xvfb xdotool dbus xclip
          cargo install tauri-driver --version 2.1.0 --locked
      - name: Build and install the Linux release package
        if: runner.os == 'Linux'
        run: |
          bun run tauri build --bundles deb -- --locked
          sudo apt-get install --reinstall -y ./src-tauri/target/release/bundle/deb/*.deb
      - name: Record the installed release identity
        if: runner.os == 'Linux'
        run: |
          mkdir -p test-results/packaged/release
          cp ./src-tauri/target/release/bundle/deb/*.deb test-results/packaged/release/
          sha256sum test-results/packaged/release/*.deb /usr/bin/choom-desktop > test-results/packaged/release/artifacts.sha256
          git rev-parse HEAD > test-results/packaged/release/source-commit.txt
          packages=(./src-tauri/target/release/bundle/deb/*.deb)
          test "${#packages[@]}" -eq 1
          packaged_hash=$(dpkg-deb --fsys-tarfile "${packages[0]}" | tar -xOf - usr/bin/choom-desktop | sha256sum | cut -d ' ' -f 1)
          installed_hash=$(sha256sum /usr/bin/choom-desktop | cut -d ' ' -f 1)
          test "$packaged_hash" = "$installed_hash"
          printf '%s\n' "$packaged_hash" > test-results/packaged/release/packaged-executable.sha256
      - name: Check the installed baseline viewer
        if: runner.os == 'Linux'
        env:
          CHOOM_PACKAGED_APP: /usr/bin/choom-desktop
          CHOOM_PACKAGED_BUILD_ID: ${{ github.sha }}
        run: xvfb-run -a dbus-run-session -- bun run test:behavior:packaged --tags @baseline-viewer
      - name: Retain installed acceptance evidence
        if: ${{ always() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installed-linux-evidence-${{ github.sha }}
          path: test-results/
