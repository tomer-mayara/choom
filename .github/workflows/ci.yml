name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bunx --no-install playwright install --with-deps chromium
      - name: Validate all four constraints
        run: ./scripts/run_all_constraints.sh
      - name: Check code hygiene
        if: ${{ !cancelled() }}
        run: |
          bun run lint
          bun run check:unused
          bun run check:duplicates
      - name: Retain browser and constraint evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-evidence-${{ github.sha }}
          path: |
            test-results/
            reports/constraints/

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: rustup show
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run desktop:lint
      - run: bun run desktop:test
      - run: bun run tauri build --debug --no-bundle -- --locked
      - name: Install Linux packaged acceptance drivers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y webkit2gtk-driver xvfb xdotool
          cargo install tauri-driver --version 2.1.0 --locked
          bunx --no-install playwright install --with-deps chromium
      - name: Build and install the Linux release package
        if: runner.os == 'Linux'
        run: |
          bun run tauri build --bundles deb -- --locked
          sudo apt-get install -y ./src-tauri/target/release/bundle/deb/*.deb
      - name: Prepare independent analyzer fixture dependencies
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/choom-fixture-deps"
          printf '%s\n' '{"private":true,"dependencies":{"dependency-cruiser":"18.7.2","typescript":"npm:@typescript/typescript6@6.0.2"}}' > "$RUNNER_TEMP/choom-fixture-deps/package.json"
          bun install --cwd "$RUNNER_TEMP/choom-fixture-deps" --ignore-scripts
          printf 'CHOOM_PACKAGED_RUNTIME_PATH=%s:/usr/local/bin:/usr/bin:/bin\n' "$(dirname "$(command -v node)")" >> "$GITHUB_ENV"
      - name: Characterize the installed picker before feature checks
        if: runner.os == 'Linux'
        env:
          CHOOM_PACKAGED_APP: /usr/bin/choom
          CHOOM_PACKAGED_BUILD_ID: ${{ github.sha }}
          CHOOM_PACKAGED_FIXTURE_MODULES: ${{ runner.temp }}/choom-fixture-deps/node_modules
        run: xvfb-run -a bun run test:behavior:packaged --tags @packaged-smoke
      - name: Check analyzer operations in the installed release
        if: runner.os == 'Linux'
        env:
          CHOOM_PACKAGED_APP: /usr/bin/choom
          CHOOM_PACKAGED_BUILD_ID: ${{ github.sha }}
          CHOOM_PACKAGED_FIXTURE_MODULES: ${{ runner.temp }}/choom-fixture-deps/node_modules
        run: xvfb-run -a bun run test:behavior:packaged --tags @packaged-native-analysis
      - name: Check installed architecture import
        if: runner.os == 'Linux'
        env:
          CHOOM_PACKAGED_APP: /usr/bin/choom
          CHOOM_PACKAGED_BUILD_ID: ${{ github.sha }}
          CHOOM_PACKAGED_FIXTURE_MODULES: ${{ runner.temp }}/choom-fixture-deps/node_modules
        run: xvfb-run -a bun run test:behavior:packaged --tags @cr-001-t08
      - name: Retain installed acceptance evidence
        if: ${{ always() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installed-linux-evidence-${{ github.sha }}
          path: test-results/
