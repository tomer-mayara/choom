  promises:
    value:
      behavior: Open, retry and cancel share one load slot; only a successful validated and laid-out result replaces
        the view.
      data: Generated WorkflowOutcome and WorkflowState describe logical results; concrete command bindings return
        Promises, and LoadWorkflowSnapshot holds a read-only baseline/layout pair.
      errors: Busy, cancelled and stage-specific failure outcomes are bounded. Unexpected errors use safe fixed
        stage messages.
      lifecycle: The owner manages disposal. Subscriptions observe state; cancelled work cannot later publish, and
        cancellation after commit does not reverse it.
