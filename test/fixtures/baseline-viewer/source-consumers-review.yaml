        - s4-001-source-excerpt-003
      description:
        value: Abort an uncommitted active load and wait for its completion. A committed view remains published.
        status: proposed
        evidenceRefs:
        - s4-001-source-src%2Farchitecture%2Fload-workflow.ts
        - s4-001-source-excerpt-003
      signature:
        value: 'readonly cancel = (): Promise<WorkflowOutcome | null> =>'
        status: proposed
        evidenceRefs:
        - s4-001-source-src%2Farchitecture%2Fload-workflow.ts
      interaction:
        value:
          input: No parameters.
          success: Returns the active completion or the last outcome when there is no active operation.
          failures: The operation can settle with its existing outcome; cancellation cannot close a pending native
