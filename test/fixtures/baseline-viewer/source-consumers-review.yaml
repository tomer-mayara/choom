          success: Prints a stage review-verified result, validation counts and an empty writes list.
          failures: Invalid arguments, missing or changed inputs, mismatched identities, invalid metadata or invalid
            candidate records stop the command with a diagnostic and nonzero exit status.
          effects: Reads the selected saved inputs and exact nine-file packet. This action does not call the publication
            function.
        status: proposed
        evidenceRefs:
