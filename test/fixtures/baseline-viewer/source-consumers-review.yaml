      accessPoint: src/architecture/generated/workflow.ts#WorkflowOperations.openBaseline
      kind:
        value: function
        status: proposed
        evidenceRefs:
        - s4-001-source-src%2Farchitecture%2Fgenerated%2Fworkflow.ts
        - s4-001-source-excerpt-004
        - s4-001-source-src%2Farchitecture%2Fload-workflow.ts
      description:
        value: Generated operation contract for starting a load. Its synchronous result declaration is distinct
          from the Promise-based implementation binding.
        status: proposed
        evidenceRefs:
        - s4-001-source-src%2Farchitecture%2Fgenerated%2Fworkflow.ts
        - s4-001-source-excerpt-004
        - s4-001-source-src%2Farchitecture%2Fload-workflow.ts
      signature:
        value: 'openBaseline(): WorkflowOutcome;'
        status: proposed
        evidenceRefs:
        - s4-001-source-src%2Farchitecture%2Fgenerated%2Fworkflow.ts
      interaction:
        value:
          input: No parameters in the generated operation declaration.
          success: A WorkflowOutcome contract describes success, cancellation, busy or stage failure.
          failures: WorkflowFailure carries the selection, reading, validation or layout stage, code, message and
            duration.
          effects: The implementation selects, reads, validates and prepares layout, then publishes a baseline/layout
            pair. The generated declaration alone performs no work.
        status: proposed
        evidenceRefs:
        - s4-001-source-src%2Farchitecture%2Fgenerated%2Fworkflow.ts
        - s4-001-source-excerpt-004
        - s4-001-source-src%2Farchitecture%2Fload-workflow.ts
      examples: []
    - id: open-binding
      name: Open baseline asynchronous binding
      accessPoint: src/architecture/load-workflow.ts#LoadWorkflow.openBaseline
      kind:
        value: function
        status: proposed
        evidenceRefs:
        - s4-001-source-src%2Farchitecture%2Fload-workflow.ts
        - s4-001-source-excerpt-003
        - s4-001-source-excerpt-005
      description:
        value: Start the single active load slot and settle a Promise with its outcome.
        status: proposed
        evidenceRefs:
        - s4-001-source-src%2Farchitecture%2Fload-workflow.ts
        - s4-001-source-excerpt-003
        - s4-001-source-excerpt-005
      signature:
        value: 'readonly openBaseline = (): Promise<WorkflowOutcome> =>'
        status: proposed
        evidenceRefs:
        - s4-001-source-src%2Farchitecture%2Fload-workflow.ts
      interaction:
        value:
          input: No call parameters; the instance uses its injected selection and layout dependencies.
          success: Publishes the copied and frozen baseline and layout together, then returns a success outcome.
          failures: Returns busy for an occupied slot; cancellation and stage failures preserve the prior current
