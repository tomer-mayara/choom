      accessPoint: docs/design/app-a/stage-4-5-publish.mjs#check
      kind:
        value: command
        status: proposed
        evidenceRefs:
        - s5-001-source-excerpt-001
        - s5-001-source-excerpt-002
      description:
        value: Validate a Stage 4 or Stage 5 packet against saved identities and evidence before publication.
        status: proposed
        evidenceRefs:
        - s5-001-source-excerpt-001
        - s5-001-source-excerpt-002
      interaction:
        value:
          input: The check action, stage 4 or 5, and an absolute review-directory argument. CHOOM_WORK, CHOOM_TOOLS,
