    - id: finish
      name: Publish a reviewed packet
      accessPoint: docs/design/app-a/stage-4-5-publish.mjs#finish
      kind:
        value: command
        status: proposed
        evidenceRefs:
        - s5-001-source-excerpt-001
        - s5-001-source-excerpt-002
      description:
        value: Save a checked Stage 4 or Stage 5 packet and advance the selected working records.
        status: proposed
        evidenceRefs:
        - s5-001-source-excerpt-001
        - s5-001-source-excerpt-002
      interaction:
        value:
          input: The finish action, stage 4 or 5, an absolute review-directory argument and the same run/attempt
            environment.
          success: Copies the packet, saves a publication receipt, replaces baseline.yaml and discovery.yaml, and
            writes run.yaml last.
          failures: An existing lock, changed files or failed validation stops publication. Failure handling attempts
            rollback and can leave attempt files or failure evidence; rollback can also fail.
          effects: Creates a publication lock, immutable attempt files and temporary working files, then renames
            the three working records. This sequence does not establish atomic multi-file publication.
        status: proposed
        evidenceRefs:
        - s5-001-source-excerpt-001
        - s5-001-source-excerpt-002
      examples: []
    - id: verify
