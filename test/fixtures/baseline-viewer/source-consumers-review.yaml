  promises:
    value:
      behavior: Check, publish or verify a manually reviewed Stage 4 or Stage 5 packet against saved identities
        and evidence.
      data: Five candidate records plus the full prompt, response, call metadata and review scope form the exact
        nine-file packet. The selected run identifies its snapshot and registered artifacts.
      errors: Validation failures stop with a diagnostic and nonzero exit status. Publication failure can retain
        attempt files or failure evidence, and rollback can fail.
      lifecycle: An operator selects the action and attempt. Check and verify are read-only. Finish locks publication,
        rechecks inputs, saves the packet, replaces drafts and writes the manifest last. Record checks do not accept
        proposed intent.
