      value: Commands for the manual Stage 4 and Stage 5 handoff. Capture, query and final-freeze commands are outside
        this documented interface.
      status: proposed
      evidenceRefs:
      - s5-001-source-excerpt-001
      - s5-001-source-excerpt-002
    entries:
