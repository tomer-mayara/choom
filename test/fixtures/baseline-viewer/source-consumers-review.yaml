        status: proposed
        evidenceRefs:
        - s4-001-source-src%2Farchitecture%2Fload-workflow.ts
        - s4-001-source-excerpt-003
        - s4-001-source-excerpt-005
      examples:
      - id: overlap
        name: Reviewed overlapping-load call sequence
        basis: source-reviewed
        content:
          value:
            text: 'const first = workflow.openBaseline();

              const busy = await workflow.openBaseline();

              const cancel = workflow.cancel();'
          status: proposed
          evidenceRefs:
          - s4-001-source-excerpt-005
    - id: retry-binding
      name: Retry the previous attempt
      accessPoint: src/architecture/load-workflow.ts#LoadWorkflow.retry
      kind:
        value: function
        status: proposed
        evidenceRefs:
        - s4-001-source-src%2Farchitecture%2Fload-workflow.ts
        - s4-001-source-excerpt-003
      description:
        value: Reread the resolved selection, or select again when the earlier attempt did not resolve one.
        status: proposed
        evidenceRefs:
        - s4-001-source-src%2Farchitecture%2Fload-workflow.ts
        - s4-001-source-excerpt-003
      signature:
        value: 'readonly retry = (): Promise<WorkflowOutcome> =>'
        status: proposed
        evidenceRefs:
        - s4-001-source-src%2Farchitecture%2Fload-workflow.ts
      interaction:
        value:
          input: No parameters. The instance retains the previous resolved selection.
          success: Runs the same read, validation, layout and publication path.
          failures: Returns no-previous-load before an attempt; other outcomes use the same busy, cancellation and
