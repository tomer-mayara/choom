      accessPoint: src/architecture/workspace.ts#createWorkspace
      kind:
        value: function
        status: proposed
        evidenceRefs:
        - s4-001-source-src%2Farchitecture%2Fworkspace.ts
        - s4-001-source-excerpt-003
      description:
        value: Create the shared load workflow and choose browser or desktop selection when a load starts. Construction
          itself performs no I/O.
        status: proposed
        evidenceRefs:
        - s4-001-source-src%2Farchitecture%2Fworkspace.ts
        - s4-001-source-excerpt-003
      signature:
        value: 'export function createWorkspace(options: { layout?: typeof layoutBaseline } = {}): WorkspaceBinding'
        status: proposed
        evidenceRefs:
        - s4-001-source-src%2Farchitecture%2Fworkspace.ts
        - s4-001-source-excerpt-003
      interaction:
        value:
          input: An optional layout dependency; the declared default is an empty options object.
          success: A WorkspaceBinding with a LoadWorkflow instance.
          failures: null
          effects: Allocates a workflow and desktop adapter. Selection and lazy layout occur later during a load.
        status: proposed
        evidenceRefs:
        - s4-001-source-src%2Farchitecture%2Fworkspace.ts
        - s4-001-source-excerpt-003
      examples: []
