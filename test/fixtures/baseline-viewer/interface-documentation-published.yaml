    promises:
      value:
        behavior: Open Baseline, Cancel and Retry coordinate one load slot and publish
          the baseline and prepared layout together. A failed or cancelled load
          preserves the previous view.
        data: The view receives read-only workflow state and a nullable frozen
          baseline/layout pair through getSnapshot and subscribe.
        errors: Outcomes distinguish success, busy, cancelled and stage-specific safe
          failures; disposed owners reject subsequent loads. A pending native
          picker retains the slot until it settles.
        lifecycle: Workspace composition owns the workflow. View subscriptions return an
          unsubscribe function; disposal stays with the owner. Late cancelled
          work cannot publish.
      status: proposed
      evidenceRefs:
