    groupingReason:
      value: The declared workspace connects loading, validation, deferred layout and
        rendering under one open-view lifecycle. Keep its internal workflow,
        codec, UI and geometry together rather than create components from each
        helper. Domain model and host file access remain children with exclusive
        direct memberships. The root Choom manifest is an aggregate of the four
        implementation boundaries, not another recovered runtime role, so this
        model omits that extra group and keeps Workspace and Native shell as
        roots. The browser and installed-view acceptance runners, steps and
        specialized fixtures follow this main workflow owner. Their native/model
        collaborators do not duplicate direct file ownership or add production
        client roles.
      status: proposed
      evidenceRefs:
        - s4-001-source-excerpt-001
