    promises:
      value:
        behavior: Decode one bounded strict YAML document and validate its recorded
          baseline without opening referenced files, executing checks, changing
          statements or running layout.
        data: Text is decoded into the generated Baseline result with a duration;
          formatVersion selects the format rather than the filename.
        errors: Return unsupported-version, invalid-encoding, invalid-document or
          limit-exceeded with safe messages. Legacy schemaVersion diagrams are
          rejected.
        lifecycle: The decoder retains no original bytes. Host file reading precedes
          decoding; layout and publication follow it. The separate producer may
          call the decoder for its documented read-only compatibility check.
      status: proposed
      evidenceRefs:
        - s4-001-source-excerpt-009
