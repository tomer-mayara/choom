[package]
name = "choom"
version = "0.1.0"
description = "Choom architecture workspace"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"

[lib]
name = "choom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[dev-dependencies]
tauri = { version = "=2.12.5", features = ["test"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"
