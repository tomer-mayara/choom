[package]
name = "choom"
version = "0.1.0"
description = "Choom architecture workspace"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"

[lib]
name = "choom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
process-wrap = { version = "=10.0.1", default-features = false, features = ["std", "process-group", "creation-flags"] }
dunce = "=1.0.5"
uuid = { version = "=1.29.0", features = ["v4"] }
same-file = "=1.0.6"

[dev-dependencies]
tauri = { version = "=2.12.5", features = ["test"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_SystemServices", "Win32_Storage_FileSystem"] }
