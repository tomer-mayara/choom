name: choom
description: Local architecture workspace delivered in a browser or Tauri desktop shell.

artifacts:
  behavior:
    - path: cookbook/behavior/workspace.feature
    - path: cookbook/behavior/architecture.feature
    - path: cookbook/behavior/desktop.feature
  observability:
    - path: cookbook/observability/service.yaml
  architecture:
    - path: .dependency-cruiser.cjs
    - path: src-tauri/Cargo.toml
    - path: src-tauri/capabilities/main.json
  contracts:
    - path: src/domain/architecture.ts
    - path: src/platform/desktop.ts
    - path: cookbook/interfaces/workspace.md
    - path: cookbook/interfaces/desktop.md

children:
  - name: workspace
    path: ./src
  - name: native-shell
    path: ./src-tauri
