name: choom
description: Local architecture workspace delivered in a browser or Tauri desktop shell.

artifacts:
  behavior:
    - path: cookbook/behavior/workspace.feature
    - path: cookbook/behavior/architecture.feature
    - path: cookbook/behavior/desktop.feature
    - path: cookbook/behavior/architecture-import/t01-explore.feature
    - path: cookbook/behavior/architecture-import/t01-installed-picker-smoke.feature
    - path: cookbook/behavior/architecture-import/t02-model.feature
    - path: cookbook/behavior/architecture-import/t02-domain.feature
    - path: cookbook/behavior/architecture-import/t03-discovery.feature
    - path: cookbook/behavior/architecture-import/t03-api.feature
    - path: cookbook/behavior/architecture-import/t04-observations.feature
    - path: cookbook/behavior/architecture-import/t04-converter.feature
    - path: cookbook/behavior/architecture-import/t05-execution.feature
    - path: cookbook/behavior/architecture-import/t05-api.feature
    - path: cookbook/behavior/architecture-import/t05-installed.feature
    - path: cookbook/behavior/architecture-import/t06-documents.feature
    - path: cookbook/behavior/architecture-import/t06-api.feature
    - path: cookbook/behavior/architecture-import/t06-installed.feature
    - path: cookbook/behavior/architecture-import/t07-workflows.feature
    - path: cookbook/behavior/architecture-import/t07-api.feature
    - path: cookbook/behavior/architecture-import/t07-dialogs.feature
    - path: cookbook/behavior/architecture-import/t08-installed.feature
  observability:
    - path: cookbook/observability/service.yaml
  architecture:
    - path: .dependency-cruiser.cjs
      enforcer: dependency-cruiser
      inputs:
        - src
    - path: src-tauri/Cargo.toml
    - path: src-tauri/capabilities/main.json
  contracts:
    - path: cookbook/interfaces/main.tsp
    - path: cookbook/interfaces/workspace.md
    - path: cookbook/interfaces/desktop.md

children:
  - name: workspace
    path: ./src
  - name: native-shell
    path: ./src-tauri
