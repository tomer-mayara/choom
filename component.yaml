name: choom
description: Local architecture workspace delivered in a browser or Tauri desktop shell.

artifacts:
  behavior:
    - path: cookbook/behavior/workspace.feature
    - path: cookbook/behavior/diagram-workspace.feature
    - path: cookbook/behavior/baseline-viewer/validation.feature
    - path: cookbook/behavior/baseline-viewer/input.feature
    - path: cookbook/behavior/baseline-viewer/open.feature
    - path: cookbook/behavior/baseline-viewer/installed.feature
    - path: cookbook/behavior/baseline-viewer/workflow.feature
  observability:
    - path: cookbook/observability/service.yaml
  architecture:
    - path: .dependency-cruiser.cjs
      enforcer: dependency-cruiser
      inputs:
        - src
    - path: src-tauri/Cargo.toml
    - path: src-tauri/capabilities/main.json
  contracts:
    - path: cookbook/interfaces/main.tsp
    - path: cookbook/interfaces/workspace.md
    - path: cookbook/interfaces/desktop.md

children:
  - name: workspace
    path: ./src
  - name: native-shell
    path: ./src-tauri
